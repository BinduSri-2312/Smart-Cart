{% extends "admin/base.html" %}

{% block title %}Admin Signup | SmartCart{% endblock %}

{% block auth_content %}

<div class="auth-page">
    <div class="auth-card">

        <div class="auth-logo">
            <i class="bi bi-bag-heart-fill"></i>
            SmartCart
        </div>

        <h2>Admin Registration</h2>
        <p>Create your administrator account to manage your store.</p>

        <form method="POST" action="{{ url_for('admin_signup') }}">

            <!-- Name -->
            <div class="mb-3">
                <label for="name" class="form-label">
                    <i class="bi bi-person me-1"></i>Full Name
                </label>
                <input
                    type="text"
                    class="form-control"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required>
            </div>

            <!-- Email -->
            <div class="mb-4">
                <label for="email" class="form-label">
                    <i class="bi bi-envelope me-1"></i>Email Address
                </label>
                <input
                    type="email"
                    class="form-control"
                    id="email"
                    name="email"
                    placeholder="Enter your email address"
                    required>
            </div>

            <!-- Submit -->
            <button type="submit" class="btn btn-primary w-100">
                <i class="bi bi-send me-2"></i>Send OTP
            </button>

        </form>

        <div class="auth-links mt-4">
            Already have an account?
            <a href="{{ url_for('admin_login') }}">Login</a>
        </div>

        <div class="text-center mt-4">
            <small class="text-muted">
                © 2026 SmartCart. All rights reserved.
            </small>
        </div>

    </div>
</div>

{% endblock %}
