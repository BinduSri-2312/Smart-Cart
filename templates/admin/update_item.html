{% extends "admin/base.html" %}

{% block title %}Update Product | SmartCart{% endblock %}

{% block page_heading %}Update Product{% endblock %}

{% block content %}

<h2>Update Product</h2>

<form method="POST"
      action="{{ url_for('update_item_page', item_id=product.product_id) }}"
      enctype="multipart/form-data">

    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">

            <div class="mb-3">
                <label class="form-label">Product Name:</label>
                <input type="text"
                       class="form-control"
                       name="name"
                       value="{{ product.name }}"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Description:</label>
                <textarea class="form-control"
                          name="description"
                          rows="4"
                          required>{{ product.description }}</textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Category:</label>
                <input type="text"
                       class="form-control"
                       name="category"
                       value="{{ product.category }}"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Price:</label>
                <input type="number"
                       class="form-control"
                       step="0.01"
                       min="0.01"
                       name="price"
                       value="{{ product.price }}"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Old Image:</label><br>

                <img src="{{ url_for('static', filename='uploads/product_images/' ~ product.image) }}"
                     width="120"
                     height="120"
                     style="object-fit:cover; border-radius:8px;"
                     alt="{{ product.name }}">
            </div>

            <div class="mb-4">
                <label class="form-label">Choose New Image (Optional):</label>
                <input type="file"
                       class="form-control"
                       name="image"
                       accept="image/*">
            </div>

            <button type="submit" class="btn btn-primary">
                <i class="bi bi-pencil-square me-2"></i>Update Product
            </button>

            <a href="{{ url_for('item_list') }}"
               class="btn btn-outline-secondary ms-2">
                Cancel
            </a>

        </div>
    </div>

</form>

{% endblock %}
